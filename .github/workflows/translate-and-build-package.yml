name: Build Package

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'With TMATE'
        required: false
        default: false

  push:
    branches: [ "*" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gettext \
            gir1.2-adw-1 \
            gir1.2-gtk-4.0 \
            gir1.2-vte-3.91 \
            python3-gi \
            python3-pytest \
            shellcheck
          python3 -m pip install --user ruff
      - name: Run focused checks
        run: |
          pytest -q
          python3 -m ruff check usr/share/biglinux/grub-restore tests
          python3 -m ruff format --check usr/share/biglinux/grub-restore tests
          shellcheck -x -P usr/share/biglinux/grub-restore/backend \
            usr/bin/biglinux-grub-restore \
            usr/share/biglinux/grub-restore/backend/*.sh \
            usr/share/biglinux/grub-restore/backend/grub-* \
            scripts/update-translations.sh
          for catalog in locale/*.po; do
            msgfmt --check --check-format -o /dev/null "$catalog"
          done

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: If Template exit
        shell: bash
        run: |
          cancel () {
            echo "Pacote de template, não precisa traduzir e compilar"
            echo "SAINDO...."
            curl -s -H "Authorization: token ${{ github.token }}" \
            -X POST "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"
            sleep infinity
          }
          if [ -n "$(grep biglinux-package-template pkgbuild/PKGBUILD)" ];then
            cancel
          fi
      
      ## Tmate ##
      - name: Setup TMATE Session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      - name: Send Hooks BigLinux Build Package
        shell: bash
        run: |
          if [ -z "$(grep biglinux-package-template pkgbuild/PKGBUILD)" ];then
            curl -X POST -H "Accept: application/json" -H "Authorization: token ${{ secrets.WEBHOOK_TOKEN }}" --data '{"event_type": "${{ github.repository }}", "client_payload": { "branch": "${{ github.ref_name }}", "url": "https://github.com/${{ github.repository }}"}}' https://api.github.com/repos/BigLinux-Package-Build/build-package/dispatches
          fi
